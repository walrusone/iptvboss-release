name: Publish XC Server Container

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: "Published IPTVBoss version, without a v prefix"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-xc-server-container
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release repository
        uses: actions/checkout@v6

      - name: Validate release assets and calculate checksums
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          set -euo pipefail

          release_tag="${REQUESTED_TAG}"
          version="${release_tag#v}"

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid version: ${version}" >&2
            exit 1
          fi

          release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${release_tag}"
          amd64_asset="iptvboss-${version}-linux-amd64.tar.gz"
          arm64_asset="iptvboss-${version}-linux-aarch64.tar.gz"

          curl --fail --location --retry 30 --retry-delay 10 --retry-all-errors \
            --output "${RUNNER_TEMP}/${amd64_asset}" \
            "${release_url}/${amd64_asset}"
          curl --fail --location --retry 30 --retry-delay 10 --retry-all-errors \
            --output "${RUNNER_TEMP}/${arm64_asset}" \
            "${release_url}/${arm64_asset}"

          tar --list --gzip --file "${RUNNER_TEMP}/${amd64_asset}" \
            | grep '/bin/iptvboss-c$' > /dev/null
          tar --list --gzip --file "${RUNNER_TEMP}/${arm64_asset}" \
            | grep '/bin/iptvboss-c$' > /dev/null

          amd64_sha256=$(sha256sum "${RUNNER_TEMP}/${amd64_asset}" | cut -d ' ' -f 1)
          arm64_sha256=$(sha256sum "${RUNNER_TEMP}/${arm64_asset}" | cut -d ' ' -f 1)

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "amd64_sha256=${amd64_sha256}" >> "${GITHUB_OUTPUT}"
          echo "arm64_sha256=${arm64_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            IPTVBOSS_VERSION=${{ steps.release.outputs.version }}
            IPTVBOSS_RELEASE_REPOSITORY=${{ github.repository }}
            IPTVBOSS_SHA256_AMD64=${{ steps.release.outputs.amd64_sha256 }}
            IPTVBOSS_SHA256_ARM64=${{ steps.release.outputs.arm64_sha256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
